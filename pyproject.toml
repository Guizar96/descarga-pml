[project]
name = "descarga-pml"
version = "0.1.0"
description = "Descarga automática de PML (MDA) desde CENACE, análisis y exportación."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.33",
  "pandas>=2.1",
  "numpy>=1.26",
  "aiohttp>=3.9",
  "tenacity>=8.2",
  "tqdm>=4.66",
  "openpyxl>=3.1",
  "plotly>=5.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]